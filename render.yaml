services:
  - type: web
    name: smartseason-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        value: smartseason-jwt-secret-2024
      - key: PORT
        value: 10000
    healthCheckPath: /health
